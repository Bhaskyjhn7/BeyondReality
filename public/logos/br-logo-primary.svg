<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background rounded square -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Main shape - rounded square with gradient -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#grad1)"/>

  <!-- Abstract geometric accent - tilted square creating depth -->
  <rect x="55" y="55" width="90" height="90" rx="20" fill="url(#grad2)" opacity="0.3" transform="rotate(12 100 100)"/>

  <!-- Letters BR - bold, modern -->
  <text x="100" y="118" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-3">BR</text>
</svg>
